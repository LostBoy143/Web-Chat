<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Chat App - Real-time Messaging</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Authentication Screen -->
    <div id="auth-screen">
        <div class="auth-container">
            <div class="auth-header">
                <h1>💬 ChatApp</h1>
                <p>Connect with friends in real-time</p>
            </div>

            <div class="auth-card">
                <!-- Tab Buttons -->
                <div class="form-tabs">
                    <button type="button" class="tab-btn active" onclick="switchTab('login')">Sign In</button>
                    <button type="button" class="tab-btn" onclick="switchTab('register')">Sign Up</button>
                </div>

                <!-- Login Form -->
                <div id="login-form" class="auth-form active">
                    <form id="loginForm">
                        <div class="form-group">
                            <label for="login-email">Email</label>
                            <input type="email" id="login-email" placeholder="your@email.com" required>
                        </div>
                        <div class="form-group">
                            <label for="login-password">Password</label>
                            <input type="password" id="login-password" placeholder="••••••••" required>
                        </div>
                        <button type="submit" class="btn-primary">Sign In</button>
                    </form>
                </div>

                <!-- Register Form -->
                <div id="register-form" class="auth-form">
                    <form id="registerForm">
                        <div class="form-group">
                            <label for="register-username">Username</label>
                            <input type="text" id="register-username" placeholder="johndoe" required>
                        </div>
                        <div class="form-group">
                            <label for="register-email">Email</label>
                            <input type="email" id="register-email" placeholder="your@email.com" required>
                        </div>
                        <div class="form-group">
                            <label for="register-password">Password</label>
                            <input type="password" id="register-password" placeholder="••••••••" minlength="6" required>
                        </div>
                        <button type="submit" class="btn-primary">Create Account</button>
                    </form>
                </div>

                <div id="auth-error" class="error-message" style="display: none;"></div>
            </div>
        </div>
    </div>

    <!-- Main Chat Interface -->
    <div id="chat-screen" class="chat-container" style="display: none;">
        <!-- Sidebar with User List -->
        <div class="sidebar">
            <div class="sidebar-header">
                <!-- Mobile close button -->
                <button class="mobile-close-btn" onclick="toggleMobileMenu()" aria-label="Close menu">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>

                <div class="current-user">
                    <div class="avatar" id="current-user-avatar">U</div>
                    <div class="user-info">
                        <h3 id="current-username">User</h3>
                        <span class="status online">Online</span>
                    </div>
                </div>

                <!-- Desktop logout button -->
                <button class="btn-logout desktop-only" onclick="logout()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                </button>
            </div>

            <!-- Scrollable sidebar content wrapper -->
            <div class="sidebar-content">
                <div class="sidebar-section">
                    <h4>Recent Chats</h4>
                    <div id="conversations-list" class="conversations-list">
                        <div class="empty-state">
                            <p>No conversations yet</p>
                            <small>Select a user to start chatting</small>
                        </div>
                    </div>
                </div>

                <div class="sidebar-section">
                    <h4>All Users</h4>
                    <div id="users-list" class="users-list">
                        <div class="loading">Loading users...</div>
                    </div>
                </div>
            </div>

            <!-- Mobile logout button at bottom -->
            <div class="sidebar-footer mobile-only">
                <button class="btn-logout-mobile" onclick="logout()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    <span>Logout</span>
                </button>
            </div>
        </div>

        <!-- Chat Area -->
        <div class="chat-area">
            <!-- Empty State -->
            <div id="empty-chat" class="empty-chat-state">
                <!-- Mobile hamburger button for empty state -->
                <button class="mobile-menu-btn mobile-menu-empty" onclick="toggleMobileMenu()" aria-label="Open menu">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
                <div class="empty-chat-content">
                    <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="1.5">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                    <h2>Select a conversation</h2>
                    <p>Tap the menu to choose from your contacts</p>
                </div>
            </div>

            <!-- Active Chat -->
            <div id="active-chat" style="display: none;">
                <!-- Chat Header -->
                <div class="chat-header">
                    <button class="mobile-menu-btn" onclick="toggleMobileMenu()" aria-label="Open menu">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <line x1="3" y1="12" x2="21" y2="12"></line>
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <line x1="3" y1="18" x2="21" y2="18"></line>
                        </svg>
                    </button>
                    <div class="chat-user-info">
                        <div class="avatar" id="chat-user-avatar">U</div>
                        <div>
                            <h3 id="chat-username">Username</h3>
                            <span class="typing-indicator" id="typing-indicator" style="display: none;">
                                typing<span class="dots">...</span>
                            </span>
                            <span class="user-status" id="chat-user-status">Offline</span>
                        </div>
                    </div>
                </div>

                <!-- Messages Area -->
                <div class="messages-container" id="messages-container">
                    <!-- Messages will be inserted here -->
                </div>

                <!-- Message Input -->
                <div class="message-input-container">
                    <form id="message-form" class="message-form">
                        <button type="button" class="attachment-btn"
                            onclick="document.getElementById('file-input').click()">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path
                                    d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48">
                                </path>
                            </svg>
                        </button>
                        <input type="file" id="file-input" accept="image/*,video/*,.pdf,.doc,.docx,.txt"
                            style="display: none">
                        <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off">
                        <button type="submit" class="send-btn">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <line x1="22" y1="2" x2="11" y2="13"></line>
                                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                            </svg>
                        </button>
                    </form>
                    <div id="file-preview" class="file-preview" style="display: none;">
                        <span id="file-name"></span>
                        <button onclick="clearFileSelection()">✕</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Scripts -->
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/socket.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
